name: 每日显影
on:
  schedule:
    - cron: "30 23 * * *"   # UTC 23:30 = 北京 07:30
  workflow_dispatch: {}      # 也可手动冲洗一版

permissions:
  contents: write

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 验证
        run: |
          python -m py_compile radar.py import_jobs.py
          python -m unittest discover -s tests
          node --test tests/test_local_filter_core.js
      - name: 冲洗
        run: python radar.py
      - name: 定影
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet && echo "今日无新影像" && exit 0
          git commit -m "显影 $(date -u +%F)"
          git push
